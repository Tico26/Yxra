name: Nightly newsletter sync

# Makes Resend's "Shopper accounts" segment match the "Send me new finds and
# offers" box on Shopper accounts, and unticks the box for anyone who unsubscribed in Resend
# (lib/newsletter-sync.js). Run it by hand from the Actions tab with "Run workflow".
#
# Needs these repository settings (Settings > Secrets and variables > Actions):
#   secret   DATABASE_URL            Supabase connection string (Session pooler URI)
#   secret   RESEND_API_KEY   Resend API key with full access (skipped if unset)

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: newsletter-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync the accounts segment with Resend
        run: npm run newsletter-sync
