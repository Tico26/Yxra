name: Nightly newsletter sync

# Makes Brevo's accounts list match the "Send me new finds and offers" box on
# Shopper accounts, and unticks the box for anyone who unsubscribed in Brevo
# (lib/newsletter-sync.js). Run it by hand from the Actions tab with "Run workflow".
#
# Needs these repository settings (Settings > Secrets and variables > Actions):
#   secret   DATABASE_URL            Supabase connection string (Session pooler URI)
#   secret   BREVO_API_KEY           Brevo API key (skipped if unset)
#   variable BREVO_ACCOUNTS_LIST_ID  id of the Brevo list "Shopper accounts"

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: newsletter-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_ACCOUNTS_LIST_ID: ${{ vars.BREVO_ACCOUNTS_LIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync the accounts list with Brevo
        run: npm run newsletter-sync
