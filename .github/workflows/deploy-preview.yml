name: Deploy preview

# Puts a preview copy of the API and the website on Cloudflare Workers, as
# yxra-api-preview and yxra-web-preview, on every push to landing-hero-preview.
# The live yxra-api and yxra-web Workers are not touched. It reads the same
# Supabase data as the live site, and sets no ADMIN_TOKEN, so /admin stays shut.

on:
  push:
    branches: [landing-hero-preview]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Deploy the preview API Worker
        id: api
        run: |
          sed -i "s/\"HYPERDRIVE_ID\"/\"$HYPERDRIVE_ID\"/" wrangler.jsonc
          contact="${{ vars.YXRA_CONTACT }}"
          npx wrangler deploy --env preview --var "YXRA_CONTACT:${contact:-https://yxra.co.uk/for-retailers}" | tee deploy.log
          echo "url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build the website
        working-directory: web
        env:
          YXRA_CONTACT_EMAIL: ${{ vars.YXRA_CONTACT_EMAIL }}
          YXRA_TRADER_NAME: ${{ vars.YXRA_TRADER_NAME }}
          YXRA_TRADER_ADDRESS: ${{ vars.YXRA_TRADER_ADDRESS }}
        run: npx opennextjs-cloudflare build
      - name: Deploy the preview website Worker
        id: web
        working-directory: web
        run: |
          npx wrangler deploy --env preview | tee deploy.log
          echo "url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check the preview answers
        env:
          API_URL: ${{ steps.api.outputs.url }}
          SITE_URL: ${{ steps.web.outputs.url }}
        run: |
          sleep 10
          curl -fsS "$API_URL/api/products" > /dev/null
          curl -fsS "$SITE_URL/" | grep -q "Plus-size shops in one search"
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
