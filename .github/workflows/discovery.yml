name: Weekly discovery

# Finds new UK plus-size shops and adds the ones Yxra can read as Suggested
# Retailers on the Review list (spec 0001, rules R22 and R23). It never adds
# a Retailer by itself. Uses the same secrets as the nightly Stock check.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YXRA_CONTACT: ${{ vars.YXRA_CONTACT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run migrate
      - run: npm run discover
