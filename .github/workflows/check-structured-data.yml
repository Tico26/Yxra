name: Check structured data

# One-off for the launch map (issue #44): runs scripts/check-structured-data.js
# from a runner with normal network access. Remove once the ticket is closed.

on:
  push:
    branches: [claude/project-thread-o6qa23]
    paths:
      - scripts/check-structured-data.js
      - .github/workflows/check-structured-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-structured-data.js
        env:
          YXRA_CONTACT: https://github.com/Tico26/Yxra
          ONLY: River Island
