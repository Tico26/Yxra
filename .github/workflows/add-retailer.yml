name: Add Retailer

# Adds a Retailer by hand from the Actions tab ("Run workflow"), so its
# Products are collected from the next Stock check. Uses the same DATABASE_URL
# secret as the nightly Stock check.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Retailer name as shoppers know it, e.g. Lovedrobe
        required: true
      site_url:
        description: Home page, e.g. https://www.lovedrobe.co.uk
        required: true
      source:
        description: How Amara's Pick reads it
        type: choice
        options: [shopify, structured_data]
        default: shopify
      women_only:
        description: The shop sells only womenswear
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  add-retailer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run migrate
      - run: npm run add-retailer -- "$NAME" "$SITE_URL" "$SOURCE" ${{ inputs.women_only && '--women-only' || '' }}
        env:
          NAME: ${{ inputs.name }}
          SITE_URL: ${{ inputs.site_url }}
          SOURCE: ${{ inputs.source }}
