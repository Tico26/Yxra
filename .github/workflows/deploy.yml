name: Deploy

# Puts the API and the website on Cloudflare Workers Free (spec 0002, D2) on
# every push to main, or by hand from the Actions tab with "Run workflow".
#
# Needs these repository settings (Settings > Secrets and variables > Actions):
#   secret   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   secret   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
#   secret   ADMIN_TOKEN            any long random string; unlocks /admin on the API
#   secret   DATABASE_URL           Supabase connection string (Session pooler URI)
#   variable HYPERDRIVE_ID          id of the Hyperdrive config pointing at Supabase
#   variable YXRA_CONTACT           contact address Retailers see in our User-Agent
#   variable YXRA_DOMAIN            optional, e.g. yxra.co.uk once it is on Cloudflare
#   variable YXRA_CONTACT_EMAIL     optional, defaults to hello@yxra.co.uk
#   variable YXRA_TRADER_NAME       name shown as who runs Yxra
#   variable YXRA_TRADER_ADDRESS    geographic address shown with it

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # bash adds pipefail, so a failed `wrangler deploy | tee` fails the step.
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
      YXRA_DOMAIN: ${{ vars.YXRA_DOMAIN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Check the Cloudflare settings are there
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$HYPERDRIVE_ID" ] || missing="$missing HYPERDRIVE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not deployed. Add these repository settings first:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci --no-audit --no-fund
      # Bring the database schema up to date before the new API goes live, the
      # same way stock-check.yml and add-retailer.yml do.
      - name: Update the database schema
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Not deployed. Add the DATABASE_URL repository secret first."
            exit 1
          fi
          npm run migrate
      - name: Deploy the API Worker
        id: api
        run: |
          sed -i "s/\"HYPERDRIVE_ID\"/\"$HYPERDRIVE_ID\"/" wrangler.jsonc
          site="${YXRA_DOMAIN:+https://$YXRA_DOMAIN}"
          contact="${{ vars.YXRA_CONTACT }}"
          npx wrangler deploy --var "YXRA_CONTACT:${contact:-${site:-https://yxra.co.uk}/for-retailers}" | tee deploy.log
          echo "url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Set the admin token
        if: env.ADMIN_TOKEN != ''
        run: echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build the website
        working-directory: web
        env:
          YXRA_SITE_URL: ${{ vars.YXRA_DOMAIN && format('https://{0}', vars.YXRA_DOMAIN) || '' }}
          YXRA_CONTACT_EMAIL: ${{ vars.YXRA_CONTACT_EMAIL }}
          YXRA_TRADER_NAME: ${{ vars.YXRA_TRADER_NAME }}
          YXRA_TRADER_ADDRESS: ${{ vars.YXRA_TRADER_ADDRESS }}
        # Vite build, then the fixed pages pre-built to HTML (scripts/prerender.mjs).
        # The four YXRA_* settings above are the only ones the pages can read.
        run: npm run build
      - name: Deploy the website Worker
        id: web
        working-directory: web
        run: |
          domains=""
          [ -n "$YXRA_DOMAIN" ] && domains="--domain $YXRA_DOMAIN --domain www.$YXRA_DOMAIN"
          npx wrangler deploy $domains | tee deploy.log
          echo "url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check the site answers
        env:
          API_URL: ${{ steps.api.outputs.url }}
          SITE_URL: ${{ steps.web.outputs.url }}
        run: |
          sleep 10
          curl -fsS "$API_URL/api/categories" > /dev/null
          # Save the page first: with pipefail, grep -q stopping at the first
          # match makes curl fail (exit 23) even when the text is there.
          curl -fsS "$SITE_URL/" -o home.html
          grep -q "Plus sizes, in stock." home.html
          # Privacy is pre-built, so its own heading is in the HTML.
          curl -fsS "$SITE_URL/privacy" -o privacy.html
          grep -q ">Privacy</h1>" privacy.html
          echo "### Live" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: $SITE_URL ${YXRA_DOMAIN:+(and https://$YXRA_DOMAIN)}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API and Review list: $API_URL/admin" >> "$GITHUB_STEP_SUMMARY"
