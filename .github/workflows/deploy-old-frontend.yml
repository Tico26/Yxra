name: Deploy old front end preview

# Builds Tico's earlier front end (old-frontend/, copied unchanged from
# Tico26/yxra_frontend) and puts it on Cloudflare as its own Worker,
# yxra-old-frontend-preview, on every push to old-frontend-preview. The live
# site and the hero preview are not touched.

on:
  push:
    branches: [old-frontend-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: old-frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: old-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy
        id: web
        run: |
          npx --yes wrangler@4.151.3 deploy | tee deploy.log
          echo "url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Check it answers
        env:
          SITE_URL: ${{ steps.web.outputs.url }}
        run: |
          sleep 10
          curl -fsS "$SITE_URL/" > /dev/null
          echo "### Old front end preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
