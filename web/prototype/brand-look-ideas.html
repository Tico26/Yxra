<title>Yxra Home Ideas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE (issue #40), throwaway: the size-first home (B) with ideas taken from Tico's earlier frontend (github.com/Tico26/yxra_frontend): shop name marquee, Standouts as one big + two stacked photos, one-shop spotlight, a grid with shop badges, and the newsletter turned into the waiting list. Two looks: the Yxra brand, and the old frontend's black and white with Didot. Sample Products only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=GFS+Didot&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: B's size-first home, then the old frontend's editorial blocks; the two variants share markup and differ only in look. */
:root {
  --ink: #2E1A3B; --bg: #FBF6EF; --surface: #FFFFFF; --muted: #5E5566; --line: #E7DED3;
  --stock: #1F6F5C; --on-ink: #FBF6EF; --band: #F1E8F3; --amber-fg: #7A4E00; --amber-bg: #FFF1D6;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --text: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px; --display-weight: 700; --track: -0.02em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #EBDDF2; --bg: #1A1220; --surface: #241A2C; --muted: #B6A9BE; --line: #3A2E44;
  --stock: #5FC7A9; --on-ink: #1A1220; --band: #2E2238; --amber-fg: #F5C76B; --amber-bg: #3A2C12; color-scheme: dark } }
:root[data-theme="dark"] {
  --ink: #EBDDF2; --bg: #1A1220; --surface: #241A2C; --muted: #B6A9BE; --line: #3A2E44;
  --stock: #5FC7A9; --on-ink: #1A1220; --band: #2E2238; --amber-fg: #F5C76B; --amber-bg: #3A2C12; color-scheme: dark }

/* the old frontend's look: black on white, GFS Didot display, Outfit text, square corners */
.mono {
  --ink: #000000; --bg: #F9FAFB; --surface: #FFFFFF; --muted: #6B7280; --line: #E5E7EB;
  --stock: #1F6F5C; --on-ink: #FFFFFF; --band: #D9D9D9;
  --display: "GFS Didot", Didot, "Bodoni 72", Georgia, serif;
  --text: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 0px; --display-weight: 400; --track: -0.03em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mono {
  --ink: #F5F5F5; --bg: #0E0E0F; --surface: #18181A; --muted: #A1A1AA; --line: #2A2A2E; --stock: #5FC7A9; --on-ink: #0E0E0F; --band: #222225 } }
:root[data-theme="dark"] .mono {
  --ink: #F5F5F5; --bg: #0E0E0F; --surface: #18181A; --muted: #A1A1AA; --line: #2A2A2E; --stock: #5FC7A9; --on-ink: #0E0E0F; --band: #222225 }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--text); margin: 0; padding-bottom: 88px }
.variant { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.45 }
.variant[hidden] { display: none }
a { color: inherit }
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--stock); outline-offset: 2px }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--track); text-wrap: balance; margin: 0 }
.muted { color: var(--muted) }
.later { font-family: var(--text); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border: 1px dashed currentColor; padding: 2px 6px; border-radius: 4px; color: var(--muted); vertical-align: middle; white-space: nowrap }
.btn { background: var(--ink); color: var(--on-ink); border: 0; border-radius: calc(var(--radius) * 9); padding: 12px 22px; font-weight: 700; cursor: pointer; white-space: nowrap }
.search { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) * 9); padding: 4px 4px 4px 16px; min-width: 0 }
.search input { border: 0; background: transparent; flex: 1; min-width: 0; padding: 10px 0; outline: none }

/* header */
.head .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 18px }
.head nav { display: flex; gap: 18px; font-weight: 700; font-size: 14px; flex-wrap: wrap }
.head nav a { text-decoration: none }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -0.03em; text-decoration: none; display: inline-flex; align-items: center; gap: 2px }
.wordmark i { display: none; width: 2px; height: .9em; background: currentColor; margin: 0 8px }
.wordmark b { color: var(--stock) }
.mono .wordmark { font-weight: 400; font-size: 44px; letter-spacing: -0.04em }
.mono .wordmark i { display: inline-block }
.wm-old { display: none } .mono .wm-new { display: none } .mono .wm-old { display: inline-flex; align-items: center }
.sizepill { justify-self: end; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; white-space: nowrap }
.sizepill span { color: var(--muted); font-weight: 400 }

/* shop name marquee (old frontend: logo marquee) */
.marquee { border-block: 1px solid var(--line); overflow: hidden; position: relative; background: var(--surface) }
.marquee .lane { display: flex; gap: 12px; width: max-content; padding-block: 12px }
.marquee span.shopname { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 18px; font-family: var(--display); font-size: 16px; white-space: nowrap }
.marquee span.sep { font-family: var(--display); font-weight: 700; align-self: center }
.marquee .lead { position: absolute; left: 0; top: 0; bottom: 0; z-index: 2; display: grid; place-items: center; padding: 0 16px; background: var(--surface); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); box-shadow: 12px 0 16px var(--surface) }
@media (prefers-reduced-motion: no-preference) {
  .marquee .lane { animation: slide 40s linear infinite }
  .marquee:hover .lane { animation-play-state: paused }
}
@keyframes slide { to { transform: translateX(-50%) } }

/* size-first hero (B) */
.hero .wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; padding-block: 40px; align-items: center }
.hero h1 { font-size: clamp(36px, 5.4vw, 64px); line-height: 1 }
.hero p { max-width: 44ch }
.picker { background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) * 1.4); padding: 20px; display: grid; gap: 14px }
.picker h2 { font-size: 20px }
.sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.sizes button { border: 1px solid var(--line); background: var(--bg); border-radius: var(--radius); padding: 12px 0; font-family: var(--display); font-weight: 700; font-size: 20px; cursor: pointer; font-variant-numeric: tabular-nums }
.sizes button.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink) }
.accuracy { color: var(--stock); font-weight: 700; font-size: 14px }

/* section title in the old frontend's style: big word over a full rule */
.title { display: grid; gap: 10px; justify-items: center; text-align: center; padding-block: 44px 24px }
.title h2 { font-size: clamp(40px, 7vw, 76px); line-height: 1 }
.title .rule { width: 100%; height: 2px; background: var(--ink) }
.title p { margin: 0 }

/* Standouts: one big + two stacked (old frontend) */
.standouts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px }
.standouts .stack { display: grid; gap: 20px }
.feature { position: relative; display: block; text-decoration: none; border: 2px solid var(--ink); border-radius: var(--radius); overflow: hidden }
.feature .photo { aspect-ratio: 4 / 3.3; height: 100% }
.standouts > .feature .photo { aspect-ratio: auto; min-height: 100% }
.feature .shopbadge { position: absolute; left: 12px; top: 12px; background: var(--ink); color: var(--on-ink); font-family: var(--display); padding: 6px 10px; border-radius: calc(var(--radius) / 2); font-size: 13px; letter-spacing: .04em }
.feature .note { position: absolute; inset: auto 0 0 0; padding: 40px 16px 14px; color: #fff; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); display: grid; gap: 2px }
.feature .note strong { font-size: 16px }
.feature .note span { font-size: 13px; opacity: .9 }
.feature .note .tick { color: #8FE3C8; font-weight: 700 }

/* shop spotlight (old frontend ShopShowcase), no autoplay */
.spot { background: var(--band); margin-top: 56px }
.spot .wrap { padding-block: 32px; display: grid; gap: 18px }
.spot-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap }
.spot-name { background: var(--surface); padding: 10px 24px; display: inline-block; font-family: var(--display); font-size: 22px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 4px solid var(--ink) }
.spot-head p { margin: 6px 0 0; max-width: 60ch }
.spot-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center }
.spot-items { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; list-style: none; padding: 0; margin: 0; min-width: 0 }
.arrow { background: none; border: 0; cursor: pointer; padding: 6px; color: var(--ink) }
.arrow svg { width: 20px; height: 40px }
.dots { display: flex; gap: 6px; justify-content: center }
.dots button { width: 8px; height: 8px; border-radius: 999px; border: 0; background: var(--ink); opacity: .2; cursor: pointer; padding: 0 }
.dots button.on { width: 28px; opacity: 1 }

/* grid with shop badges */
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; list-style: none; padding: 0; margin: 0 }
.pcard { display: grid; gap: 4px; text-decoration: none }
.pcard .photo { position: relative; border-radius: var(--radius) }
.pcard .badge { position: absolute; left: 10px; bottom: 10px; background: var(--ink); color: var(--on-ink); font-family: var(--display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px }
.pcard .name { margin-top: 6px }
.price { font-weight: 700; font-variant-numeric: tabular-nums }
.tick { color: var(--stock); font-weight: 700; font-size: 13px }

.photo { aspect-ratio: 3 / 4; max-width: 100%; display: grid; place-items: center; overflow: hidden }
.photo svg { width: 44%; height: auto }

/* waiting list (old frontend newsletter) */
.join { padding-block: 64px 24px }
.join .wrap { max-width: 720px; display: grid; gap: 16px; justify-items: center; text-align: center }
.join .kicker { font-family: var(--display); letter-spacing: .3em; text-transform: uppercase; font-size: 13px }
.join h2 { font-size: clamp(30px, 4.6vw, 48px) }
.join form { width: 100%; display: grid; gap: 12px; text-align: left }
.join .row { display: flex; gap: 8px; flex-wrap: wrap }
.join input[type=email] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; border-radius: var(--radius) }
.join label.consent { display: flex; gap: 10px; align-items: start; font-size: 13px; color: var(--muted) }
.join .done { color: var(--stock); font-weight: 700 }

.foot { margin-top: 40px; border-top: 1px solid var(--line) }
.foot .wrap { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; padding-block: 28px; font-size: 13px }
.foot h3 { font-size: 15px; margin-bottom: 8px }
.foot ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; color: var(--muted) }

@media (max-width: 860px) {
  .head .wrap { grid-template-columns: 1fr auto; }
  .head nav { display: none }
  .hero .wrap { grid-template-columns: 1fr; padding-block: 28px }
  .standouts { grid-template-columns: 1fr }
  .standouts > .feature .photo { aspect-ratio: 4 / 5 }
  .spot-items { grid-template-columns: repeat(5, 62%); overflow-x: auto; scroll-snap-type: x mandatory }
  .spot-row { grid-template-columns: 1fr }
  .arrow { display: none }
  .grid { grid-template-columns: repeat(2, 1fr) }
  .foot .wrap { grid-template-columns: 1fr }
}

.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 13px/1.2 system-ui, sans-serif; max-width: calc(100vw - 32px) }
.switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; flex: none }
.switcher span { padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sample { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 20; background: #111; color: #fff; font: 11px system-ui, sans-serif; padding: 4px 8px; border-radius: 4px; opacity: .8 }
</style>

<div class="sample">Prototype · sample Products</div>

<template id="page">
  <header class="head"><div class="wrap">
    <nav><a href="#">Dresses</a><a href="#">Tops</a><a href="#">Jeans</a><a href="#">Swimwear</a><a href="#">Activewear</a></nav>
    <a class="wordmark" href="#"><span class="wm-new">Yxra<b>.</b></span><span class="wm-old">YX<i></i>RA</span></a>
    <button class="sizepill"><span>Your size</span> UK 24</button>
  </div></header>

  <div class="marquee" aria-label="Shops Yxra searches"><span class="lead">Searching tonight</span><div class="lane"></div></div>

  <section class="hero"><div class="wrap">
    <div style="display:grid;gap:14px">
      <span class="accuracy">✓ 96 of 100 checked items were in stock last week</span>
      <h1>Every plus-size shop. Only what's in your size.</h1>
      <p class="muted" style="margin:0">Pick your UK size once. We read the shops overnight and check again the moment you click.</p>
    </div>
    <div class="picker">
      <h2>Pick your UK size</h2>
      <div class="sizes"></div>
      <label class="search"><input class="q" placeholder="What are you after? e.g. wedding guest dress"><button class="btn">Search</button></label>
    </div>
  </div></section>

  <div class="wrap">
    <div class="title"><h2>Standouts</h2><div class="rule"></div><p class="muted">The most bought on Yxra this week, in a 24 <span class="later">After launch. At launch this block shows "New in"</span></p></div>
    <div class="standouts">
      <div class="stack"></div>
    </div>
  </div>

  <section class="spot"><div class="wrap">
    <div class="spot-head">
      <div><span class="spot-name"></span><p class="spot-about muted"></p></div>
      <span class="later">Later, a paid weekly Placement can take this spot, labelled "Sponsored ad"</span>
    </div>
    <div class="spot-row">
      <button class="arrow prev" aria-label="Previous shop"><svg viewBox="0 0 24 48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 44L4 24L20 4"/></svg></button>
      <ul class="spot-items"></ul>
      <button class="arrow next" aria-label="Next shop"><svg viewBox="0 0 24 48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4L20 24L4 44"/></svg></button>
    </div>
    <div class="dots"></div>
  </div></section>

  <div class="wrap">
    <div class="title"><h2>New in</h2><div class="rule"></div><p class="muted">In stock in a 24 tonight, one from each shop</p></div>
    <ul class="grid newin"></ul>
  </div>

  <section class="join"><div class="wrap">
    <span class="kicker">Yxra opens 12 November</span>
    <h2>Be first in when the doors open</h2>
    <p class="muted" style="margin:0">Join the waiting list and we'll email you once, on the day. No account, nothing to pay.</p>
    <form class="joinform">
      <div class="row"><input type="email" required placeholder="Your email address" aria-label="Email address"><button class="btn" type="submit">Join the list</button></div>
      <label class="consent"><input type="checkbox" required> Email me when Yxra opens. I can unsubscribe in one click, and Yxra never shares my email.</label>
      <p class="done" hidden>You're on the list. We'll email you on 12 November.</p>
    </form>
  </div></section>

  <footer class="foot"><div class="wrap">
    <div><a class="wordmark" href="#" style="font-size:28px"><span class="wm-new">Yxra<b>.</b></span><span class="wm-old">YX<i></i>RA</span></a><p class="muted">Shops pay us commission when you buy through our links. It never changes the order of results.</p></div>
    <div><h3>Help</h3><ul><li>How we check stock</li><li>Report a wrong item</li><li>Shops we search</li></ul></div>
    <div><h3>About</h3><ul><li>Privacy</li><li>Cookies (we use none)</li><li>Contact</li></ul></div>
  </div></footer>
</template>

<section class="variant" id="v1" data-name="Old frontend ideas, Yxra brand"></section>
<section class="variant mono" id="v2" data-name="Old frontend ideas, old frontend look" hidden></section>

<div class="switcher" role="group" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button>
</div>

<script>
const SIZES = [18, 20, 22, 24, 26, 28, 30, 32];
const SHOPS = [
  ["Lovedrobe", "Sizes 16 to 32. Their own plus-size label, cut for a curvier fit."],
  ["Hollin & Rye", "Sizes 18 to 34. Workwear and occasion dresses in longer lengths."],
  ["Marlow Curve", "Sizes 16 to 30. Swimwear with built-in support and tummy control."],
  ["Ninth Street", "Sizes 18 to 32. Denim in three leg lengths and two hip fits."],
  ["Fernhill", "Sizes 16 to 28. Linen and cotton basics, sized by UK label."],
  ["Sable & Co", "Sizes 18 to 36. Evening wear and party dresses."]
];
const tones = ["#C9B6D9","#2F3A4A","#B4472F","#E7C9A9","#1F1A1D","#7E9C82","#D9677E","#F0D36B","#3D6C8C"];
const shapes = [
  "M22 2h16l2 12 10 8-6 6 12 50H4l12-50-6-6 10-8z",
  "M18 14l12 6 12-6 16 12-8 10-6-4v34H16V32l-6 4-8-10z",
  "M16 6h6l8 18 8-18h6l2 26-6 14 10 26H6l10-26-6-14z",
  "M10 2h40l4 76H36L30 28l-6 50H6z"
];
const NAMES = ["Wrap midi dress","Linen blend shirt","Ruched swimsuit","Wide-leg jeans","Satin slip dress","Puff sleeve blouse","Tankini set","Barrel-leg jeans","Tiered maxi dress","Ribbed vest top"];
const photo = (i, extra = "") => `<div class="photo" style="background:${tones[i % tones.length]}"><svg viewBox="0 0 60 80"><path fill="rgba(255,255,255,.55)" d="${shapes[i % 4]}"/></svg>${extra}</div>`;
const price = i => [24, 32, 38, 45, 28, 55, 19, 42, 65, 36][i % 10];

document.querySelectorAll(".variant").forEach(root => {
  root.appendChild(document.getElementById("page").content.cloneNode(true));
  const $ = s => root.querySelector(s);

  const names = SHOPS.map(s => s[0]);
  const loop = [...names, ...names, ...names, ...names];
  $(".lane").innerHTML = loop.map((n, i) => `<span class="shopname">${n}</span><span class="sep">${"YXRA"[i % 4]}</span>`).join("");

  $(".sizes").innerHTML = SIZES.map(s => `<button class="${s === 24 ? "on" : ""}">${s}</button>`).join("");
  $(".sizes").addEventListener("click", e => { const b = e.target.closest("button"); if (b) $(".sizes").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });

  const feature = (i, shop) => `<a class="feature" href="#">${photo(i, `<span class="shopbadge">${SHOPS[shop][0]}</span>
    <span class="note"><strong>${NAMES[i]}, £${price(i)}</strong><span>${SHOPS[shop][1]}</span><span class="tick">✓ In stock in 24 · bought ${18 - i * 3} times this week</span></span>`)}</a>`;
  $(".stack").innerHTML = feature(1, 1) + feature(2, 2);
  $(".standouts").insertAdjacentHTML("beforeend", feature(0, 0));

  let cur = 0;
  const drawSpot = () => {
    const [n, about] = SHOPS[cur];
    $(".spot-name").textContent = n;
    $(".spot-about").textContent = about;
    $(".spot-items").innerHTML = Array.from({ length: 5 }, (_, k) => { const i = cur * 3 + k;
      return `<li><a class="pcard" href="#">${photo(i)}<span class="name">${NAMES[i % 10]}</span><span class="price">£${price(i)}</span><span class="tick">✓ In stock in 24</span></a></li>`; }).join("");
    $(".dots").innerHTML = SHOPS.map((_, i) => `<button class="${i === cur ? "on" : ""}" aria-label="Show ${SHOPS[i][0]}"></button>`).join("");
  };
  $(".prev").onclick = () => { cur = (cur + SHOPS.length - 1) % SHOPS.length; drawSpot(); };
  $(".next").onclick = () => { cur = (cur + 1) % SHOPS.length; drawSpot(); };
  $(".dots").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { cur = [...$(".dots").children].indexOf(b); drawSpot(); } });
  drawSpot();

  $(".newin").innerHTML = Array.from({ length: 10 }, (_, i) => `<li><a class="pcard" href="#">${photo(i + 4, `<span class="badge">${SHOPS[i % SHOPS.length][0]}</span>`).replace('class="photo"', 'class="photo" style="position:relative"')}
    <span class="name">${NAMES[(i + 3) % 10]}</span><span class="price">£${price(i + 2)}</span><span class="tick">✓ In stock in 24</span></a></li>`).join("");

  $(".joinform").addEventListener("submit", e => { e.preventDefault(); $(".joinform .done").hidden = false; });
});

const ids = ["1", "2"];
let v = Math.max(0, ids.indexOf((location.hash || "#v1").replace("#v", "")));
const show = () => {
  ids.forEach((k, i) => document.getElementById("v" + k).hidden = i !== v);
  document.getElementById("label").textContent = `${v + 1} of 2 · ${document.getElementById("v" + ids[v]).dataset.name}`;
  try { history.replaceState(null, "", "#v" + ids[v]); } catch {}
  window.scrollTo(0, 0);
};
const step = d => { v = (v + d + ids.length) % ids.length; show(); };
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
document.addEventListener("click", e => { const a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); });
show();
</script>
